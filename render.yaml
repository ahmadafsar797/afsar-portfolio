services:
  - type: web
    name: afsar-portfolio
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm rebuild better-sqlite3 --build-from-source && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
